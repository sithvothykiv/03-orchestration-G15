id: 3_rag_with_websearch
namespace: sunrise_llm_course

# Description: Shows dynamic RAG using a web search tool instead of a pre-ingested document.
# Useful for answering questions about real-time, rapidly changing, or highly recent topics.
description: |
  This flow demonstrates RAG (Retrieval Augmented Generation) by means of a live web search to look up Kestra release information and answer questions accurately.
  
  Compare this with 2_chat_with_rag.yaml which uses static content ingestion and an embedding store.

tasks:
  # Task 1: Chat Completion using a dynamic Web Search Content Retriever
  - id: chat_with_rag_and_websearch_content_retriever
    type: io.kestra.plugin.ai.rag.ChatCompletion
    chatProvider:
      type: io.kestra.plugin.ai.provider.GoogleGemini
      apiKey: "{{ secret('GEMINI_API_KEY') }}"
      modelName: gemini-3.5-flash
    contentRetrievers:
      # Content Retriever: Dynamically fetches contextual information before executing the prompt
      - type: io.kestra.plugin.ai.retriever.TavilyWebSearch
        # Uses Tavily API to perform web searches and returns search results as reference context
        apiKey: "{{ secret('TAVILY_API_KEY') }}"
    systemMessage: You are a helpful assistant that can answer questions about Kestra.
    prompt: What is the latest release of Kestra?
