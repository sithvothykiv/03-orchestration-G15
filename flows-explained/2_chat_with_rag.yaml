id: 2_chat_with_rag
namespace: sunrise_llm_course

# Description: Demonstrates static Retrieval Augmented Generation (RAG).
# It fetches a document from a URL, creates vector embeddings, and stores them in Kestra's KV Store,
# then queries the model using that vector store as reference context.
description: |
  This flow demonstrates RAG (Retrieval Augmented Generation) by ingesting Kestra release documentation and using it to answer questions accurately.
  
  Compare this with 1_chat_without_rag.yaml to see the difference RAG makes!

tasks:
  # Task 1: Ingest document and generate embeddings
  - id: ingest_release_notes
    type: io.kestra.plugin.ai.rag.IngestDocument
    description: Ingest Kestra 1.1 release notes to create embeddings
    provider:
      # Uses the Gemini embedding model (gemini-embedding-001) to vectorize text
      type: io.kestra.plugin.ai.provider.GoogleGemini
      modelName: gemini-embedding-001
      apiKey: "{{ secret('GEMINI_API_KEY') }}"
    embeddings:
      # Embeddings Store: Kestra internal Key-Value storage used to persist vectors locally
      type: io.kestra.plugin.ai.embeddings.KestraKVStore
    drop: true  # If true, clears any existing vectors in this KV store namespace before ingesting
    fromExternalURLs:
      # Source URL containing the raw markdown release notes for Kestra 1.1
      - https://raw.githubusercontent.com/kestra-io/docs/refs/heads/main/src/contents/blogs/release-1-1/index.md

  # Task 2: Chat completion grounded by RAG context
  - id: chat_with_rag
    type: io.kestra.plugin.ai.rag.ChatCompletion
    description: Query about Kestra 1.1 features with RAG context
    chatProvider:
      # Provider for generating text answers
      type: io.kestra.plugin.ai.provider.GoogleGemini
      modelName: gemini-3.5-flash
      apiKey: "{{ secret('GEMINI_API_KEY') }}"
    embeddingProvider:
      # Provider for vectorizing the user prompt to find matching passages in the store
      type: io.kestra.plugin.ai.provider.GoogleGemini
      modelName: gemini-embedding-001
      apiKey: "{{ secret('GEMINI_API_KEY') }}"
    embeddings:
      # Point to the same KV Store where we ingested the document in Task 1
      type: io.kestra.plugin.ai.embeddings.KestraKVStore
    systemMessage: |
      You are a helpful assistant that answers questions about Kestra.
      Use the provided documentation to give accurate, specific answers.
      If you don't find the information in the context, say so.
    prompt: |
      Which features were released in Kestra 1.1? 
      Please list at least 5 major features with brief descriptions.

  # Task 3: Log the grounded response
  - id: log_results
    type: io.kestra.plugin.core.log.Log
    message: |
      ✅ RAG Response (with retrieved context):
      {{ outputs.chat_with_rag.textOutput }}
      
      🎉 Note that this response is detailed, accurate, and grounded in the actual release documentation. Compare this with the output from 1_chat_without_rag.yaml!
